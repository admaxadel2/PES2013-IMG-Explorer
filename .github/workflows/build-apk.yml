name: Build PES 2013 IMG Explorer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        id: build
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$APK"
          echo "apk_path=$PROJECT_DIR/$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-IMG-Explorer-APK
          path: ${{ steps.build.outputs.apk_path }}
          
