name: Build PES 2013 IMG Explorer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract v7 project ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          files = list(Path(".").glob("*.zip"))
          preferred = [
              f for f in files
              if "fixed_v7" in f.name.lower()
          ]

          candidates = preferred + [
              f for f in files if f not in preferred
          ]

          selected = None

          for archive in candidates:
              try:
                  with zipfile.ZipFile(archive) as z:
                      names = z.namelist()
                      if (
                          any(n.endswith("/gradlew") for n in names)
                          and any(n.endswith("/app/build.gradle.kts") for n in names)
                      ):
                          selected = archive
                          break
              except Exception:
                  continue

          if selected is None:
              raise SystemExit("ERROR: No valid PES2013 project ZIP found.")

          print("Selected ZIP:", selected)
          with zipfile.ZipFile(selected) as z:
              z.extractall("project")
          PY

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find project -type f -name gradlew -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found after extraction."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-IMG-Explorer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
